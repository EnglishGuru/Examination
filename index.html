<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTutor | A1 Benchmark Exam</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2340;--mute:#6b7490;--line:#e3e7f2;--brand:#5b5bf0;--brand2:#8b5cf6;--ok:#10b981;--err:#dc2626}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1100px 460px at 50% -10%,#e0e4ff 0,transparent 60%),var(--bg);font-family:Poppins,Cairo,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:20px}
.wrap{width:100%;max-width:720px}.top{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 14px;font-weight:600}.logo{display:flex;gap:10px;align-items:center}.dot{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:14px}.count{color:var(--mute);font-size:13px}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}.card{background:var(--card);border-radius:22px;padding:clamp(20px,5vw,30px);box-shadow:0 10px 40px rgba(40,50,120,.08)}.chip{display:inline-block;background:#eef0ff;color:var(--brand);font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;margin-bottom:14px}h1{font-size:26px;margin:0 0 8px}h2{font-size:20px;line-height:1.5;margin:0 0 18px;font-weight:600}.sub{color:var(--mute);line-height:1.7;margin:0 0 20px}.rtl{direction:rtl;font-family:Cairo,Poppins,sans-serif}.field-label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:15px 0 7px}input,textarea{width:100%;font:inherit;padding:14px 16px;border:2px solid var(--line);border-radius:14px;outline:none;background:#fff;color:var(--ink)}input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(91,91,240,.1)}textarea{min-height:150px;resize:vertical;line-height:1.65}.opt{display:flex;align-items:center;gap:13px;padding:14px 15px;border:2px solid var(--line);border-radius:15px;margin-bottom:10px;cursor:pointer;transition:.15s}.opt:hover{border-color:#c7ccf5}.opt.sel{border-color:var(--brand);background:#f5f5ff}.opt b{width:29px;height:29px;border-radius:9px;background:#f0f2fa;display:grid;place-items:center;font-size:12px;color:var(--mute);flex:none}.opt.sel b{background:var(--brand);color:white}.passage,.description{background:#f8f9fe;border-left:4px solid var(--brand);border-radius:13px;padding:15px 17px;margin:0 0 18px;line-height:1.75;color:#39415f;white-space:pre-wrap}.nav{display:flex;gap:12px;margin-top:24px}button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px 20px;cursor:pointer}.btn{flex:1;background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;box-shadow:0 8px 20px rgba(91,91,240,.22)}.btn:disabled{opacity:.42;cursor:not-allowed}.ghost{background:#eef0f8;color:var(--mute)}.err{color:var(--err);font-size:13px;margin-top:12px;min-height:18px}.center{text-align:center;padding:28px 8px}.tick{width:78px;height:78px;border-radius:50%;background:#d1fae5;color:var(--ok);display:grid;place-items:center;font-size:40px;margin:0 auto 18px}.section-title{font-size:13px;color:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}.recbox{text-align:center;padding:12px 0}.mic{width:88px;height:88px;border-radius:50%;margin:8px auto 10px;display:grid;place-items:center;font-size:34px;color:white;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 9px 24px #5b5bf044}.mic.rec{background:var(--err)}.hint{color:var(--mute);font-size:13px;margin:6px 0}.upload{display:inline-block;margin-top:12px;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;padding:9px 13px;border-radius:12px;background:#eef0ff}audio{width:100%;margin:10px 0}.small{font-size:12px;color:var(--mute);line-height:1.6}
@media(max-width:520px){body{padding:12px}.nav button{padding:13px 12px}.top{margin-top:2px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo"><div class="dot">A1</div><span>MyTutor Benchmark Exam</span></div><div class="count" id="count"></div></div>
  <div class="bar"><i id="prog"></i></div>
  <main id="app"><div class="card"><h2>Loading exam…</h2><p class="sub">Please wait while we load the latest questions.</p></div></main>
</div>
<script>
/* Only the Apps Script deployment URL needs to be added here after deployment. */
const CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbw7e8J3quh2BcTfavZbYmgtIi5dXac0Vs2skvHNmTQzoJCevx1JL5efqezMkH2YPJ8DXw/exec',
  CLOUD_NAME: 'blvvsjgf',
  UPLOAD_PRESET: 'mytutor_a1_audio',
  CLOUDINARY_FOLDER: 'a1-benchmark',
  MAX_AUDIO_MB: 12,
  MAX_RECORD_SECONDS: 180
};
const app=document.getElementById('app');
let formData=null, questions=[], steps=[], step=0, answers={}, nameValue='', recordings={}, recorderState=null, nameItem=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='myTutorCb'+Date.now()+Math.floor(Math.random()*1000);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('انتهت مهلة الاتصال. تأكدي من رابط Apps Script المنشور.'));},20000);
    function cleanup(){clearTimeout(timer);delete window[cb];script.remove();}
    window[cb]=data=>{cleanup();resolve(data);};
    script.onerror=()=>{cleanup();reject(new Error('تعذر الاتصال بـ Google Apps Script.'))};
    script.src=url+(url.includes('?')?'&':'?')+'action=questions&callback='+cb;
    document.head.appendChild(script);
  });
}
function classify(item){
  const t=(item.title+' '+item.helpText).toLowerCase();
  if(/speaking|voice|recording|pronunciation/.test(t)) return 'speaking';
  if(/writing|write a|written response/.test(t)) return 'writing';
  if(/full name|student name|your name/.test(t)) return 'name';
  return 'normal';
}
function buildSteps(){
  steps=[];
  nameItem=null;
  formData.items.forEach(item=>{
    if(item.type==='SECTION_HEADER'||item.type==='PAGE_BREAK'){steps.push({kind:'section',item});return;}
    if(['MULTIPLE_CHOICE','LIST','CHECKBOX','TEXT','PARAGRAPH_TEXT','SCALE'].includes(item.type)){
      const kind=classify(item);
      // Full Name is collected on the welcome screen only.
      if(kind==='name'){nameItem=item;return;}
      steps.push({kind,item});
    }
  });
  questions=steps.filter(s=>s.kind!=='section');
}
function renderStart(){
  document.getElementById('count').textContent='';
  document.getElementById('prog').style.width='0%';
  app.innerHTML=`<div class="card"><span class="chip">A1 English Assessment</span><h1>${esc(formData.title||'A1 Benchmark Exam')}</h1>
  <p class="sub rtl">${esc(formData.description||'اكتبي اسمك وابدئي الامتحان. أجيبي عن الأسئلة بالترتيب.')}</p>
  <label class="field-label">Full name</label><input id="studentName" autocomplete="name" placeholder="Enter your full name">
  <div class="err" id="startErr"></div><div class="nav"><button class="btn" id="startBtn" disabled>Start exam →</button></div></div>`;
  const input=document.getElementById('studentName'),btn=document.getElementById('startBtn');
  input.addEventListener('input',()=>{nameValue=input.value.trim();btn.disabled=!nameValue;});
  btn.onclick=()=>{
    nameValue=input.value.trim();
    if(!nameValue)return;
    if(nameItem)answers[nameItem.id]=nameValue;
    step=0;
    renderStep();
  };
}
function renderStep(){
  while(step<steps.length && steps[step].kind==='section'){
    const item=steps[step].item;
    // Section descriptions are displayed together with the next question where possible.
    step++;
    if(item.title||item.helpText){steps.splice(step,0,{kind:'sectionDisplay',item});}
  }
  if(step>=steps.length){submitExam();return;}
  const current=steps[step];
  if(current.kind==='sectionDisplay'){
    const it=current.item;
    app.innerHTML=`<div class="card"><span class="chip">Section</span><h2>${esc(it.title||'')}</h2><div class="description">${esc(it.helpText||'')}</div><div class="nav"><button class="btn" id="continue">Continue →</button></div></div>`;
    document.getElementById('continue').onclick=()=>{step++;renderStep();};return;
  }
  const item=current.item, kind=current.kind, id=item.id;
  const total=questions.length;
  const qIndex=steps.slice(0,step+1).filter(s=>s.kind!=='section'&&s.kind!=='sectionDisplay').length;
  document.getElementById('count').textContent=`Question ${qIndex} / ${total}`;
  document.getElementById('prog').style.width=(qIndex/Math.max(total,1)*100)+'%';
  let body=`<div class="card"><span class="chip">${kind==='speaking'?'Speaking':kind==='writing'?'Writing':esc(item.type.replace('_',' '))}</span>`;
  if(item.helpText) body+=`<div class="description">${esc(item.helpText)}</div>`;
  body+=`<h2>${esc(item.title)}</h2>`;
  const saved=answers[id];
  if(kind==='speaking'){
    body+=`<div class="recbox" id="recbox"></div><div class="small">You can record your answer or upload an audio file. Maximum length: 3 minutes. Maximum file size: ${CONFIG.MAX_AUDIO_MB} MB.</div>`;
  } else if(kind==='name'){
    body+=`<input id="answer" value="${esc(saved||nameValue)}" placeholder="Full name">`;
  } else if(item.type==='MULTIPLE_CHOICE'||item.type==='LIST'){
    (item.choices||[]).forEach((choice,i)=>{body+=`<div class="opt ${saved===choice?'sel':''}" data-value="${esc(choice)}"><b>${String.fromCharCode(65+i)}</b><span>${esc(choice)}</span></div>`;});
  } else if(item.type==='CHECKBOX'){
    (item.choices||[]).forEach((choice,i)=>{const checked=Array.isArray(saved)&&saved.includes(choice);body+=`<div class="opt ${checked?'sel':''}" data-check="${esc(choice)}"><b>${checked?'✓':String.fromCharCode(65+i)}</b><span>${esc(choice)}</span></div>`;});
  } else if(item.type==='PARAGRAPH_TEXT'||kind==='writing'){
    body+=`<textarea id="answer" placeholder="Type your answer here…">${esc(saved||'')}</textarea>`;
  } else if(item.type==='SCALE'){
    const lo=Number(item.lowerBound||1),hi=Number(item.upperBound||5);
    body+=`<label class="field-label">${esc(item.leftLabel||lo)} — ${esc(item.rightLabel||hi)}</label><input id="answer" type="number" min="${lo}" max="${hi}" value="${esc(saved??'')}" placeholder="Choose a number">`;
  } else {
    body+=`<input id="answer" value="${esc(saved||'')}" placeholder="Your answer">`;
  }
  body+=`<div class="err" id="qErr"></div><div class="nav">${step>0?'<button class="ghost" id="back">← Back</button>':''}<button class="btn" id="next"> ${step===steps.length-1?'Submit exam ✓':'Next →'} </button></div></div>`;
  app.innerHTML=body;
  if(kind==='speaking'){drawRecorder(id);}
  if(item.type==='MULTIPLE_CHOICE'||item.type==='LIST'){
    app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{answers[id]=el.dataset.value;app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');});
  } else if(item.type==='CHECKBOX'){
    app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{let arr=Array.isArray(answers[id])?[...answers[id]]:[];const v=el.dataset.check;arr=arr.includes(v)?arr.filter(x=>x!==v):arr.concat(v);answers[id]=arr;el.classList.toggle('sel');el.querySelector('b').textContent=arr.includes(v)?'✓':'•';});
  } else if(kind!=='speaking'){
    const inp=document.getElementById('answer');
    if(inp) inp.addEventListener('input',()=>{answers[id]=item.type==='SCALE'?inp.value:inp.value; if(kind==='name')nameValue=inp.value.trim();});
  }
  const back=document.getElementById('back');if(back)back.onclick=()=>{if(kind==='speaking'&&recorderState)stopRecording();step--;renderStep();};
  document.getElementById('next').onclick=()=>{
    if(kind==='speaking'&&!recordings[id]){document.getElementById('qErr').textContent='Please record or upload your answer before continuing.';return;}
    if(kind==='name'&&!String(answers[id]||nameValue).trim()){document.getElementById('qErr').textContent='Please enter your full name.';return;}
    if(item.required && answers[id]===undefined && kind!=='speaking'){document.getElementById('qErr').textContent='Please answer this question before continuing.';return;}
    if(kind==='name')answers[id]=nameValue;
    if(kind==='speaking')answers[id]=recordings[id];
    step++;renderStep();
  };
  window.scrollTo(0,0);
}
function drawRecorder(id){
  const box=document.getElementById('recbox'), existing=recordings[id];
  if(existing){box.innerHTML=`<div class="hint">✓ Recording ready. You can listen before continuing.</div><audio controls src="${existing.preview}"></audio><button class="ghost" id="redo">Record again</button>`;document.getElementById('redo').onclick=()=>{delete recordings[id];drawRecorder(id);};return;}
  box.innerHTML=`<div class="mic" id="mic">🎙</div><div class="hint" id="recHint">Tap to start recording</div><label class="upload">Or upload an audio file<input id="audioFile" type="file" accept="audio/*" hidden></label>`;
  document.getElementById('mic').onclick=()=>startRecording(id);
  document.getElementById('audioFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>CONFIG.MAX_AUDIO_MB*1024*1024){document.getElementById('qErr').textContent='The audio file is larger than the allowed size.';return;}recordings[id]={blob:f,preview:URL.createObjectURL(f)};drawRecorder(id);};
}
function startRecording(id){
  if(!navigator.mediaDevices||!window.MediaRecorder){document.getElementById('qErr').textContent='Recording is not supported in this browser. Please upload an audio file instead.';return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];let mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
    const rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    recorderState={rec,stream,chunks:[],id,started:Date.now(),timer:null};
    rec.ondataavailable=e=>{if(e.data.size)recorderState.chunks.push(e.data);};
    rec.onstop=()=>{const state=recorderState;clearInterval(state.timer);state.stream.getTracks().forEach(t=>t.stop());const blob=new Blob(state.chunks,{type:rec.mimeType||'audio/webm'});recordings[id]={blob,preview:URL.createObjectURL(blob)};recorderState=null;drawRecorder(id);};
    rec.start();document.getElementById('mic').classList.add('rec');document.getElementById('mic').textContent='■';
    document.getElementById('recHint').textContent='Recording… tap the red button to stop';
    document.getElementById('mic').onclick=stopRecording;
    recorderState.timer=setInterval(()=>{if(recorderState&&Date.now()-recorderState.started>=CONFIG.MAX_RECORD_SECONDS*1000)stopRecording();},500);
  }).catch(()=>{document.getElementById('qErr').textContent='Microphone permission was not granted. Allow microphone access or upload an audio file.';});
}
function stopRecording(){if(recorderState&&recorderState.rec.state!=='inactive')recorderState.rec.stop();}
async function uploadRecording(record){
  const fd=new FormData();fd.append('file',record.blob,'speaking-answer');fd.append('upload_preset',CONFIG.UPLOAD_PRESET);fd.append('folder',CONFIG.CLOUDINARY_FOLDER);
  const response=await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.CLOUD_NAME}/video/upload`,{method:'POST',body:fd});
  const data=await response.json();if(!response.ok||!data.secure_url)throw new Error(data.error?.message||'Cloudinary audio upload failed.');
  return data.secure_url;
}
async function submitExam(){
  app.innerHTML=`<div class="card"><h2>Submitting your exam…</h2><p class="sub">Please keep this page open while your answers and recordings are being sent.</p></div>`;
  try{
    const answersToSend=[];
    if(nameItem && nameValue.trim()){
      answersToSend.push({id:nameItem.id,value:nameValue.trim()});
    }
    for(const q of questions){
      const id=q.item.id;
      if(q.kind==='speaking'){
        if(!recordings[id])throw new Error('A Speaking recording is missing.');
        const url=await uploadRecording(recordings[id]);
        answersToSend.push({id,value:url});
      }else{
        let value=answers[id];
        if(q.kind==='name')value=nameValue||value;
        if(value!==undefined && value!==null && value!=='')answersToSend.push({id,value});
      }
    }
    const response=await fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'submit',answers:answersToSend})});
    // Apps Script web-app POST is cross-origin; no-cors hides its response from the browser.
    app.innerHTML=`<div class="card center"><div class="tick">✓</div><h1>Submission request sent</h1><p class="sub rtl">تم إرسال طلب تسليم الامتحان. لأن المتصفح لا يسمح لنا بقراءة تأكيد Google من هذا الاتصال، يُرجى عدم اعتبار الرسالة تأكيدًا نهائيًا قبل التأكد من ظهور الرد في Google Forms.</p><p class="small">Your teacher can verify the response in the Google Form responses tab.</p></div>`;
  }catch(err){
    app.innerHTML=`<div class="card"><h2>We couldn't submit the exam</h2><p class="err">${esc(err.message)}</p><p class="sub">Your answers are still on this page. Please check your internet connection and try again.</p><button class="btn" id="retry">Try again</button></div>`;
    document.getElementById('retry').onclick=submitExam;
  }
}
async function init(){
  try{
    if(CONFIG.APPS_SCRIPT_URL.includes('PASTE_'))throw new Error('Apps Script web app URL has not been added yet.');
    const result=await jsonp(CONFIG.APPS_SCRIPT_URL);
    if(!result.ok)throw new Error(result.error||'Could not load form questions.');
    formData=result.form;buildSteps();renderStart();
  }catch(err){
    app.innerHTML=`<div class="card"><h2>Exam setup needed</h2><p class="err">${esc(err.message)}</p><p class="sub rtl">بعد نشر Google Apps Script، ضعي رابط Web App في إعدادات الملف، ثم ارفعي الملف على GitHub.</p></div>`;
  }
}
init();
</script>
</body>
</html>
