<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark Exam</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4f6fb;
  --card:#fff;
  --ink:#1c2340;
  --mute:#6b7490;
  --line:#e3e7f2;
  --brand:#5b5bf0;
  --brand2:#8b5cf6;
  --ok:#10b981;
  --err:#dc2626;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(1100px 460px at 50% -10%,#e0e4ff 0,transparent 60%),var(--bg);
  font-family:Poppins,Cairo,system-ui,sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  padding:20px;
}

.wrap{width:100%;max-width:720px}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:6px 4px 14px;
  font-weight:600;
}

.logo{display:flex;gap:10px;align-items:center}

.dot{
  width:36px;
  height:36px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;
  display:grid;
  place-items:center;
  font-size:14px;
}

.count{color:var(--mute);font-size:13px}

.bar{
  height:8px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
  margin-bottom:18px;
}

.bar i{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .3s;
}

.card{
  background:var(--card);
  border-radius:22px;
  padding:clamp(20px,5vw,30px);
  box-shadow:0 10px 40px rgba(40,50,120,.08);
}

.chip{
  display:inline-block;
  background:#eef0ff;
  color:var(--brand);
  font-size:12px;
  font-weight:600;
  padding:5px 12px;
  border-radius:99px;
  margin-bottom:14px;
}

h1{font-size:26px;margin:0 0 8px}
h2{font-size:20px;line-height:1.5;margin:0 0 18px;font-weight:600}

.sub{
  color:var(--mute);
  line-height:1.7;
  margin:0 0 20px;
}

.rtl{
  direction:rtl;
  font-family:Cairo,Poppins,sans-serif;
}

.field-label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--mute);
  margin:15px 0 7px;
}

input,textarea{
  width:100%;
  font:inherit;
  padding:14px 16px;
  border:2px solid var(--line);
  border-radius:14px;
  outline:none;
  background:#fff;
  color:var(--ink);
}

input:focus,textarea:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 4px rgba(91,91,240,.1);
}

textarea{
  min-height:150px;
  resize:vertical;
  line-height:1.65;
}

.opt{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 15px;
  border:2px solid var(--line);
  border-radius:15px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.15s;
}

.opt:hover{border-color:#c7ccf5}

.opt.sel{
  border-color:var(--brand);
  background:#f5f5ff;
}

.opt b{
  width:29px;
  height:29px;
  border-radius:9px;
  background:#f0f2fa;
  display:grid;
  place-items:center;
  font-size:12px;
  color:var(--mute);
  flex:none;
}

.opt.sel b{
  background:var(--brand);
  color:white;
}

.passage,.description{
  background:#f8f9fe;
  border-left:4px solid var(--brand);
  border-radius:13px;
  padding:15px 17px;
  margin:0 0 18px;
  line-height:1.75;
  color:#39415f;
  white-space:pre-wrap;
}

.passage{
  font-size:15px;
}

.section-title{
  font-size:13px;
  color:var(--brand);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:12px;
}

.nav{
  display:flex;
  gap:12px;
  margin-top:24px;
}

button{
  font:inherit;
  font-weight:600;
  border:0;
  border-radius:14px;
  padding:14px 20px;
  cursor:pointer;
}

.btn{
  flex:1;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:white;
  box-shadow:0 8px 20px rgba(91,91,240,.22);
}

.btn:disabled{opacity:.42;cursor:not-allowed}

.ghost{
  background:#eef0f8;
  color:var(--mute);
}

.err{
  color:var(--err);
  font-size:13px;
  margin-top:12px;
  min-height:18px;
}

.center{text-align:center;padding:28px 8px}

.tick{
  width:78px;
  height:78px;
  border-radius:50%;
  background:#d1fae5;
  color:var(--ok);
  display:grid;
  place-items:center;
  font-size:40px;
  margin:0 auto 18px;
}

.recbox{text-align:center;padding:12px 0}

.mic{
  width:88px;
  height:88px;
  border-radius:50%;
  margin:8px auto 10px;
  display:grid;
  place-items:center;
  font-size:34px;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  box-shadow:0 9px 24px #5b5bf044;
}

.mic.rec{background:var(--err)}

.hint{color:var(--mute);font-size:13px;margin:6px 0}

.upload{
  display:inline-block;
  margin-top:12px;
  color:var(--brand);
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  padding:9px 13px;
  border-radius:12px;
  background:#eef0ff;
}

audio{width:100%;margin:10px 0}

.small{
  font-size:12px;
  color:var(--mute);
  line-height:1.6;
}

.loading-spinner{
  width:36px;
  height:36px;
  border:4px solid var(--line);
  border-top-color:var(--brand);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:20px auto;
}

@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:520px){
  body{padding:12px}
  .nav button{padding:13px 12px}
  .top{margin-top:2px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="logo">
      <div class="dot">A1</div>
      <span>Benchmark Exam</span>
    </div>
    <div class="count" id="count"></div>
  </div>

  <div class="bar">
    <i id="prog"></i>
  </div>

  <main id="app">
    <div class="card center">
      <div class="loading-spinner"></div>
      <h2>Loading exam…</h2>
      <p class="sub">Please wait while we load the latest questions.</p>
    </div>
  </main>

</div>

<script>

/* =========================================
   CONFIGURATION
   ========================================= */

const CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbw7e8J3quh2BcTfavZbYmgtIi5dXac0Vs2skvHNmTQzoJCevx1JL5efqezMkH2YPJ8DXw/exec',

  CLOUD_NAME: 'blvvsjgf',
  UPLOAD_PRESET: 'mytutor_a1_audio',
  CLOUDINARY_FOLDER: 'a1-benchmark',

  MAX_AUDIO_MB: 12,
  MAX_RECORD_SECONDS: 180,

  LEVEL: 'A1'
};


/* =========================================
   GLOBAL VARIABLES
   ========================================= */

const app = document.getElementById('app');

let formData = null;
let questions = [];
let steps = [];
let step = 0;

let answers = {};
let nameValue = '';

let recordings = {};
let recorderState = null;
let nameItem = null;

let submissionToken = null;
let submitting = false;


/* =========================================
   HELPERS
   ========================================= */

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function makeToken(){
  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID().replace(/-/g,'');
  }

  return 'mt' +
    Date.now().toString(36) +
    Math.random().toString(36).slice(2) +
    Math.random().toString(36).slice(2);
}


/* =========================================
   GOOGLE APPS SCRIPT JSONP
   ========================================= */

function jsonp(action,extra={}){

  return new Promise((resolve,reject)=>{

    const callbackName =
      'benchmarkCallback' +
      Date.now() +
      Math.floor(Math.random()*10000);

    const script = document.createElement('script');

    const timer = setTimeout(()=>{
      cleanup();
      reject(new Error(
        'Google connection timed out. Please try again.'
      ));
    },25000);

    function cleanup(){
      clearTimeout(timer);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = data=>{
      cleanup();
      resolve(data);
    };

    script.onerror = ()=>{
      cleanup();
      reject(new Error(
        'Could not connect to Google Apps Script.'
      ));
    };

    const params = new URLSearchParams({
      action:action,
      callback:callbackName,
      ...extra
    });

    script.src =
      CONFIG.APPS_SCRIPT_URL + '?' + params.toString();

    document.head.appendChild(script);
  });
}


/* =========================================
   QUESTION CLASSIFICATION
   ========================================= */

function classify(item){

  const text =
    (item.title + ' ' + item.helpText).toLowerCase();

  if(/speaking|voice|recording|pronunciation/.test(text)){
    return 'speaking';
  }

  if(/writing|write a|written response/.test(text)){
    return 'writing';
  }

  if(/full name|student name|your name/.test(text)){
    return 'name';
  }

  return 'normal';
}


/* =========================================
   BUILD EXAM STEPS
   READING PASSAGE IS ATTACHED TO EACH
   READING QUESTION
   ========================================= */

function buildSteps(){

  steps = [];
  nameItem = null;

  let readingPassage = '';

  formData.items.forEach(item=>{

    if(
      item.type === 'SECTION_HEADER' ||
      item.type === 'PAGE_BREAK'
    ){

      const title = (item.title || '').trim();
      const description = (item.helpText || '').trim();

      if(/^reading\b/i.test(title)){

        readingPassage =
          [title,description].filter(Boolean).join('\n\n');

      }else if(title || description){

        steps.push({
          kind:'section',
          item:item
        });

      }

      return;
    }

    const supportedTypes = [
      'MULTIPLE_CHOICE',
      'LIST',
      'CHECKBOX',
      'TEXT',
      'PARAGRAPH_TEXT',
      'SCALE'
    ];

    if(!supportedTypes.includes(item.type)){
      return;
    }

    const kind = classify(item);

    if(kind === 'name'){
      nameItem = item;
      return;
    }

    const isReadingQuestion =
      /^reading\s*\d+/i.test(item.title || '');

    steps.push({
      kind:kind,
      item:item,
      readingPassage:
        isReadingQuestion ? readingPassage : ''
    });

  });

  questions = steps.filter(s=>s.kind !== 'section');
}


/* =========================================
   START SCREEN
   ========================================= */

function renderStart(){

  document.getElementById('count').textContent = '';
  document.getElementById('prog').style.width = '0%';

  app.innerHTML = `
    <div class="card">

      <span class="chip">A1 English Assessment</span>

      <h1>${esc(formData.title || 'Benchmark Exam')}</h1>

      <p class="sub rtl">
        ${esc(formData.description ||
          'اكتبي اسمك وابدئي الامتحان. أجيبي عن الأسئلة بالترتيب.')}
      </p>

      <label class="field-label">Full name</label>

      <input
        id="studentName"
        autocomplete="name"
        placeholder="Enter your full name"
      >

      <div class="err" id="startErr"></div>

      <div class="nav">
        <button class="btn" id="startBtn" disabled>
          Start exam →
        </button>
      </div>

    </div>
  `;

  const input = document.getElementById('studentName');
  const button = document.getElementById('startBtn');

  input.addEventListener('input',()=>{
    nameValue = input.value.trim();
    button.disabled = !nameValue;
  });

  button.onclick = ()=>{

    nameValue = input.value.trim();

    if(!nameValue){
      return;
    }

    if(nameItem){
      answers[nameItem.id] = nameValue;
    }

    step = 0;
    renderStep();
  };
}


/* =========================================
   RENDER QUESTION
   ========================================= */

function renderStep(){

  // Display other section headers normally.
  // Reading headers are deliberately not separate steps.
  while(
    step < steps.length &&
    steps[step].kind === 'section'
  ){

    const item = steps[step].item;

    step++;

    if(item.title || item.helpText){

      steps.splice(step,0,{
        kind:'sectionDisplay',
        item:item
      });

    }
  }


  if(step >= steps.length){
    submitExam();
    return;
  }


  const current = steps[step];


  if(current.kind === 'sectionDisplay'){

    const item = current.item;

    app.innerHTML = `
      <div class="card">

        <span class="chip">Section</span>

        <h2>${esc(item.title || '')}</h2>

        <div class="description">
          ${esc(item.helpText || '')}
        </div>

        <div class="nav">
          <button class="btn" id="continue">
            Continue →
          </button>
        </div>

      </div>
    `;

    document.getElementById('continue').onclick = ()=>{
      step++;
      renderStep();
    };

    return;
  }


  const item = current.item;
  const kind = current.kind;
  const id = item.id;

  const total = questions.length;

  const qIndex = steps
    .slice(0,step+1)
    .filter(s=>
      s.kind !== 'section' &&
      s.kind !== 'sectionDisplay'
    ).length;


  document.getElementById('count').textContent =
    `Question ${qIndex} / ${total}`;

  document.getElementById('prog').style.width =
    (qIndex / Math.max(total,1) * 100) + '%';


  let body = `
    <div class="card">

      <span class="chip">
        ${
          kind === 'speaking'
            ? 'Speaking'
            : kind === 'writing'
              ? 'Writing'
              : esc(item.type.replace('_',' '))
        }
      </span>
  `;


  // Reading passage appears before EACH reading question.
  if(current.readingPassage){

    body += `
      <div class="passage">
        <div class="section-title">Reading Passage</div>
        ${esc(current.readingPassage)}
      </div>
    `;

  }


  if(item.helpText){

    body += `
      <div class="description">
        ${esc(item.helpText)}
      </div>
    `;

  }


  body += `<h2>${esc(item.title)}</h2>`;


  const saved = answers[id];


  /* SPEAKING */

  if(kind === 'speaking'){

    body += `
      <div class="recbox" id="recbox"></div>

      <div class="small">
        You can record your answer or upload an audio file.
        Maximum length: 3 minutes.
        Maximum file size: ${CONFIG.MAX_AUDIO_MB} MB.
      </div>
    `;

  }


  /* MULTIPLE CHOICE / LIST */

  else if(
    item.type === 'MULTIPLE_CHOICE' ||
    item.type === 'LIST'
  ){

    (item.choices || []).forEach((choice,index)=>{

      body += `
        <div
          class="opt ${saved === choice ? 'sel' : ''}"
          data-value="${esc(choice)}"
        >
          <b>${String.fromCharCode(65+index)}</b>
          <span>${esc(choice)}</span>
        </div>
      `;

    });

  }


  /* CHECKBOX */

  else if(item.type === 'CHECKBOX'){

    (item.choices || []).forEach((choice,index)=>{

      const checked =
        Array.isArray(saved) && saved.includes(choice);

      body += `
        <div
          class="opt ${checked ? 'sel' : ''}"
          data-check="${esc(choice)}"
        >
          <b>${checked ? '✓' : String.fromCharCode(65+index)}</b>
          <span>${esc(choice)}</span>
        </div>
      `;

    });

  }


  /* WRITING */

  else if(
    item.type === 'PARAGRAPH_TEXT' ||
    kind === 'writing'
  ){

    body += `
      <textarea
        id="answer"
        placeholder="Type your answer here…"
      >${esc(saved || '')}</textarea>
    `;

  }


  /* SCALE */

  else if(item.type === 'SCALE'){

    const low = Number(item.lowerBound || 1);
    const high = Number(item.upperBound || 5);

    body += `
      <label class="field-label">
        ${esc(item.leftLabel || low)}
        —
        ${esc(item.rightLabel || high)}
      </label>

      <input
        id="answer"
        type="number"
        min="${low}"
        max="${high}"
        value="${esc(saved ?? '')}"
        placeholder="Choose a number"
      >
    `;

  }


  /* TEXT */

  else{

    body += `
      <input
        id="answer"
        value="${esc(saved || '')}"
        placeholder="Your answer"
      >
    `;

  }


  body += `
      <div class="err" id="qErr"></div>

      <div class="nav">

        ${
          step > 0
            ? '<button class="ghost" id="back">← Back</button>'
            : ''
        }

        <button class="btn" id="next">
          ${step === steps.length-1
            ? 'Submit exam ✓'
            : 'Next →'}
        </button>

      </div>

    </div>
  `;


  app.innerHTML = body;


  /* SPEAKING RECORDER */

  if(kind === 'speaking'){
    drawRecorder(id);
  }


  /* MULTIPLE CHOICE */

  if(
    item.type === 'MULTIPLE_CHOICE' ||
    item.type === 'LIST'
  ){

    app.querySelectorAll('.opt').forEach(element=>{

      element.onclick = ()=>{

        answers[id] = element.dataset.value;

        app.querySelectorAll('.opt').forEach(x=>{
          x.classList.remove('sel');
        });

        element.classList.add('sel');
      };

    });

  }


  /* CHECKBOX */

  else if(item.type === 'CHECKBOX'){

    app.querySelectorAll('.opt').forEach(element=>{

      element.onclick = ()=>{

        let selected =
          Array.isArray(answers[id])
            ? [...answers[id]]
            : [];

        const value = element.dataset.check;

        selected = selected.includes(value)
          ? selected.filter(x=>x !== value)
          : selected.concat(value);

        answers[id] = selected;

        element.classList.toggle('sel');

        element.querySelector('b').textContent =
          selected.includes(value) ? '✓' : '•';

      };

    });

  }


  /* TEXT / WRITING / SCALE */

  else if(kind !== 'speaking'){

    const input = document.getElementById('answer');

    if(input){

      input.addEventListener('input',()=>{

        answers[id] = input.value;

        if(kind === 'name'){
          nameValue = input.value.trim();
        }

      });

    }

  }


  /* BACK BUTTON */

  const back = document.getElementById('back');

  if(back){

    back.onclick = ()=>{

      if(kind === 'speaking' && recorderState){
        stopRecording();
      }

      step--;
      renderStep();

    };

  }


  /* NEXT BUTTON */

  document.getElementById('next').onclick = ()=>{

    const errorBox = document.getElementById('qErr');


    if(kind === 'speaking' && !recordings[id]){

      errorBox.textContent =
        'Please record or upload your answer before continuing.';

      return;
    }


    if(kind === 'name' && !String(answers[id] || nameValue).trim()){

      errorBox.textContent =
        'Please enter your full name.';

      return;
    }


    if(item.required){

      const value = answers[id];

      const missing =
        value === undefined ||
        value === null ||
        value === '' ||
        (Array.isArray(value) && value.length === 0);

      if(missing){

        errorBox.textContent =
          'Please answer this question before continuing.';

        return;
      }

    }


    if(kind === 'name'){
      answers[id] = nameValue;
    }

    step++;
    renderStep();

  };


  window.scrollTo(0,0);
}


/* =========================================
   SPEAKING RECORDER
   ========================================= */

function drawRecorder(id){

  const box = document.getElementById('recbox');
  const existing = recordings[id];


  if(existing){

    box.innerHTML = `
      <div class="hint">
        ✓ Recording ready. You can listen before continuing.
      </div>

      <audio controls src="${existing.preview}"></audio>

      <button class="ghost" id="redo">
        Record again
      </button>
    `;

    document.getElementById('redo').onclick = ()=>{

      delete recordings[id];
      drawRecorder(id);

    };

    return;
  }


  box.innerHTML = `
    <div class="mic" id="mic">🎙</div>

    <div class="hint" id="recHint">
      Tap to start recording
    </div>

    <label class="upload">
      Or upload an audio file

      <input
        id="audioFile"
        type="file"
        accept="audio/*"
        hidden
      >
    </label>
  `;


  document.getElementById('mic').onclick = ()=>{
    startRecording(id);
  };


  document.getElementById('audioFile').onchange = event=>{

    const file = event.target.files[0];

    if(!file) return;

    if(file.size > CONFIG.MAX_AUDIO_MB * 1024 * 1024){

      document.getElementById('qErr').textContent =
        'The audio file is larger than the allowed size.';

      return;
    }

    recordings[id] = {
      blob:file,
      preview:URL.createObjectURL(file)
    };

    drawRecorder(id);

  };

}


/* =========================================
   START RECORDING
   ========================================= */

function startRecording(id){

  if(
    !navigator.mediaDevices ||
    !window.MediaRecorder
  ){

    document.getElementById('qErr').textContent =
      'Recording is not supported in this browser. Please upload an audio file instead.';

    return;
  }


  navigator.mediaDevices.getUserMedia({audio:true})

    .then(stream=>{

      const types = [
        'audio/webm;codecs=opus',
        'audio/mp4',
        'audio/webm'
      ];

      const mime =
        types.find(type=>MediaRecorder.isTypeSupported(type)) || '';

      const recorder = mime
        ? new MediaRecorder(stream,{mimeType:mime})
        : new MediaRecorder(stream);


      const state = {
        rec:recorder,
        stream:stream,
        chunks:[],
        id:id,
        started:Date.now(),
        timer:null
      };

      recorderState = state;


      recorder.ondataavailable = event=>{

        if(event.data.size){
          state.chunks.push(event.data);
        }

      };


      recorder.onstop = ()=>{

        clearInterval(state.timer);

        state.stream.getTracks().forEach(track=>{
          track.stop();
        });

        const blob = new Blob(
          state.chunks,
          {type:recorder.mimeType || 'audio/webm'}
        );

        recordings[id] = {
          blob:blob,
          preview:URL.createObjectURL(blob)
        };

        if(recorderState === state){
          recorderState = null;
        }

        // Update the current question only if it is still visible.
        if(document.getElementById('recbox')){
          drawRecorder(id);
        }

      };


      recorder.start();


      document.getElementById('mic').classList.add('rec');
      document.getElementById('mic').textContent = '■';

      document.getElementById('recHint').textContent =
        'Recording… tap the red button to stop';


      document.getElementById('mic').onclick = stopRecording;


      state.timer = setInterval(()=>{

        if(
          recorderState === state &&
          Date.now() - state.started >=
            CONFIG.MAX_RECORD_SECONDS * 1000
        ){

          stopRecording();

        }

      },500);

    })

    .catch(()=>{

      document.getElementById('qErr').textContent =
        'Microphone permission was not granted. Allow microphone access or upload an audio file.';

    });

}


/* =========================================
   STOP RECORDING
   ========================================= */

function stopRecording(){

  if(
    recorderState &&
    recorderState.rec.state !== 'inactive'
  ){

    recorderState.rec.stop();

  }

}


/* =========================================
   UPLOAD RECORDING TO CLOUDINARY
   ========================================= */

async function uploadRecording(record){

  const form = new FormData();

  form.append(
    'file',
    record.blob,
    'speaking-answer'
  );

  form.append('upload_preset',CONFIG.UPLOAD_PRESET);
  form.append('folder',CONFIG.CLOUDINARY_FOLDER);


  const response = await fetch(
    `https://api.cloudinary.com/v1_1/${CONFIG.CLOUD_NAME}/video/upload`,
    {
      method:'POST',
      body:form
    }
  );


  const data = await response.json();


  if(!response.ok || !data.secure_url){

    throw new Error(
      data.error?.message ||
      'Cloudinary audio upload failed.'
    );

  }


  return data.secure_url;
}


/* =========================================
   CHECK GOOGLE SUBMISSION STATUS
   ========================================= */

async function waitForSubmission(token){

  const started = Date.now();

  while(Date.now() - started < 90000){

    const result = await jsonp('status',{
      token:token
    });


    if(result.ok && result.status === 'complete'){
      return result;
    }


    if(result.status === 'error' || result.ok === false){

      throw new Error(
        result.error || 'Google Forms could not save this response.'
      );

    }


    await wait(1500);

  }


  throw new Error(
    'لم يصلنا تأكيد الحفظ من Google حتى الآن. لا نقدر نؤكد إن الرد اتحفظ. راجعي تبويب Responses قبل إعادة الإرسال.'
  );

}


/* =========================================
   SUBMIT EXAM
   ========================================= */

async function submitExam(){

  if(submitting) return;

  submitting = true;

  if(!submissionToken){
    submissionToken = makeToken();
  }


  app.innerHTML = `
    <div class="card center">

      <div class="loading-spinner"></div>

      <h2>Submitting your exam…</h2>

      <p class="sub">
        Please keep this page open while your answers and recordings are being sent.
      </p>

      <p class="small" id="submitStatus">
        Preparing answers…
      </p>

    </div>
  `;


  try{

    const answersToSend = [];


    // Full Name
    if(nameItem && nameValue.trim()){

      answersToSend.push({
        id:nameItem.id,
        value:nameValue.trim()
      });

    }


    // Other non-speaking answers
    for(const question of questions){

      const id = question.item.id;

      if(question.kind === 'speaking'){
        continue;
      }

      const value = answers[id];

      if(
        value !== undefined &&
        value !== null &&
        value !== ''
      ){

        answersToSend.push({
          id:id,
          value:value
        });

      }

    }


    // Make sure all three Speaking recordings exist.
    const speakingQuestions = questions.filter(
      question=>question.kind === 'speaking'
    );


    for(const question of speakingQuestions){

      if(!recordings[question.item.id]){

        throw new Error(
          'A Speaking recording is missing. Please go back and record all Speaking tasks.'
        );

      }

    }


    const statusElement =
      document.getElementById('submitStatus');


    // Upload all three recordings in parallel.
    if(statusElement){

      statusElement.textContent =
        'Uploading Speaking recordings…';

    }


    const uploadedRecordings = await Promise.all(

      speakingQuestions.map(async question=>{

        const id = question.item.id;

        const url = await uploadRecording(recordings[id]);

        return {
          id:id,
          value:url
        };

      })

    );


    uploadedRecordings.forEach(answer=>{
      answersToSend.push(answer);
    });


    if(statusElement){

      statusElement.textContent =
        'Sending answers to Google Forms…';

    }


    // Google Apps Script receives the submission.
    // no-cors hides its response, so we verify through the status endpoint.
    await fetch(
      CONFIG.APPS_SCRIPT_URL,
      {
        method:'POST',
        mode:'no-cors',
        headers:{
          'Content-Type':'text/plain;charset=utf-8'
        },
        body:JSON.stringify({
          action:'submit',
          token:submissionToken,
          answers:answersToSend
        })
      }
    );


    if(statusElement){

      statusElement.textContent =
        'Waiting for Google to confirm that your response was saved…';

    }


    // Do not show completion until Google Apps Script confirms the save.
    const confirmation =
      await waitForSubmission(submissionToken);


    const message =
      (
        confirmation.confirmationMessage ||
        formData.confirmationMessage ||
        'Thank you! Your exam has been submitted successfully.'
      ).trim();


    document.getElementById('count').textContent =
      'Completed';

    document.getElementById('prog').style.width =
      '100%';


    app.innerHTML = `
      <div class="card center">

        <div class="tick">✓</div>

        <h1>Exam completed!</h1>

        <p class="sub rtl">
          ${esc(message)}
        </p>

        <p class="small">
          Your response has been saved successfully.
        </p>

      </div>
    `;


  }catch(error){

    submitting = false;


    app.innerHTML = `
      <div class="card">

        <h2>We couldn't confirm your submission</h2>

        <p class="err">
          ${esc(error.message)}
        </p>

        <p class="sub rtl">
          لم نتمكن من تأكيد حفظ الإجابات حتى الآن.
          يُرجى مراجعة المدرّس والتأكد من ظهور الرد في Google Forms قبل إعادة الإرسال.
        </p>

        <button class="btn" id="retry">
          Try again
        </button>

      </div>
    `;


    document.getElementById('retry').onclick = ()=>{

      // A fresh token is used for a new attempt after a confirmed error.
      submissionToken = null;

      submitExam();

    };

  }

}


/* =========================================
   INITIALIZE EXAM
   ========================================= */

async function init(){

  try{

    if(
      !CONFIG.APPS_SCRIPT_URL ||
      CONFIG.APPS_SCRIPT_URL.includes('PASTE_')
    ){

      throw new Error(
        'Apps Script web app URL has not been configured.'
      );

    }


    const result = await jsonp('questions',{
      level:CONFIG.LEVEL
    });


    if(!result.ok){

      throw new Error(
        result.error || 'Could not load form questions.'
      );

    }


    formData = result.form;

    buildSteps();

    renderStart();


  }catch(error){

    app.innerHTML = `
      <div class="card">

        <h2>Exam setup needed</h2>

        <p class="err">
          ${esc(error.message)}
        </p>

        <p class="sub rtl">
          حدثت مشكلة أثناء تحميل الامتحان.
          يُرجى التأكد من رابط Google Apps Script المنشور.
        </p>

        <button class="btn" onclick="location.reload()">
          Reload exam
        </button>

      </div>
    `;

  }

}


init();
