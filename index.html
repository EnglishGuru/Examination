<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 Benchmark Pre-Exam</title>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1c2340;--mute:#6b7490;--line:#e3e7f2;--brand:#5b5bf0;--brand2:#8b5cf6;--ok:#10b981;--err:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(1200px 500px at 50% -10%,#e0e4ff 0,transparent 60%),var(--bg);
    font-family:Poppins,Cairo,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:680px}
  .top{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 14px;font-weight:600}
  .logo{display:flex;gap:10px;align-items:center}
  .dot{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:15px}
  .count{color:var(--mute);font-size:14px}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .35s}
  .card{background:var(--card);border-radius:22px;padding:28px;box-shadow:0 10px 40px rgba(40,50,120,.08);animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .chip{display:inline-block;background:#eef0ff;color:var(--brand);font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;margin-bottom:14px}
  h1{font-size:26px;margin:0 0 6px}
  h2{font-size:21px;line-height:1.45;margin:0 0 20px;font-weight:600}
  p.sub{color:var(--mute);margin:0 0 22px;line-height:1.6}
  label.f{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
  input,textarea{width:100%;font:inherit;padding:14px 16px;border:2px solid var(--line);border-radius:14px;outline:none;background:#fff;color:var(--ink);transition:.15s}
  input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(91,91,240,.12)}
  textarea{min-height:170px;resize:vertical;line-height:1.6}
  .opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border:2px solid var(--line);border-radius:16px;margin-bottom:11px;cursor:pointer;transition:.15s;font-size:16px}
  .opt:hover{border-color:#c7ccf5;transform:translateY(-1px)}
  .opt b{width:30px;height:30px;border-radius:10px;background:#f0f2fa;display:grid;place-items:center;font-size:13px;color:var(--mute);flex:none;transition:.15s}
  .opt.sel{border-color:var(--brand);background:#f5f5ff}
  .opt.sel b{background:var(--brand);color:#fff}
  .passage{background:#f8f9fe;border-left:4px solid var(--brand);border-radius:14px;padding:16px 18px;margin-bottom:20px;font-size:15px;line-height:1.7;color:#39415f}
  .passage h4{margin:0 0 8px;font-size:15px}
  .nav{display:flex;gap:12px;margin-top:24px}
  button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:15px 22px;cursor:pointer;transition:.15s}
  .btn{flex:1;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px rgba(91,91,240,.3)}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .ghost{background:#eef0f8;color:var(--mute)}
  .ghost:hover{background:#e3e7f2}
  .center{text-align:center;padding:30px 10px}
  .tick{width:84px;height:84px;border-radius:50%;background:#d1fae5;color:var(--ok);display:grid;place-items:center;font-size:42px;margin:0 auto 18px}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .err{color:var(--err);font-size:14px;margin-top:12px;min-height:18px}
  .rtl{direction:rtl;font-family:Cairo,Poppins,sans-serif}
  ol.say{margin:0 0 18px;padding-left:22px;line-height:1.9;color:#39415f;background:#f8f9fe;border-radius:14px;padding:14px 14px 14px 36px}
  .recbox{text-align:center;padding:10px 0 4px}
  .mic{width:96px;height:96px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;font-size:38px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 26px rgba(91,91,240,.35);transition:.15s}
  .mic:hover{transform:scale(1.05)}
  .mic.rec{background:var(--err);box-shadow:0 0 0 0 rgba(239,68,68,.5);animation:pulse 1.3s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 22px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  .tm{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
  .hint{color:var(--mute);font-size:14px;margin-top:4px}
  .up{display:inline-block;margin-top:16px;color:var(--brand);font-weight:600;font-size:14px;cursor:pointer;padding:8px 14px;border-radius:12px;background:#eef0ff}
  audio{width:100%;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><div class="dot">A1</div><span>Benchmark Exam</span></div>
    <div class="count" id="count"></div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div id="app"></div>
</div>

<script>
// ⬇️ الإعدادات: الصقي القيم الأربعة دي (الشرح في الخطوات)
var CONFIG = {
  FORM_URL: 'PASTE_GOOGLE_FORM_LINK_HERE',        // رابط الفورم الطويل (بينتهي بـ viewform)
  PREFILLED: 'PASTE_PREFILLED_LINK_HERE',         // الرابط الجاهز من Get pre-filled link
  CLOUD_NAME: 'PASTE_CLOUDINARY_CLOUD_NAME',      // اسم الـ cloud في Cloudinary
  UPLOAD_PRESET: 'PASTE_UPLOAD_PRESET_NAME'       // اسم الـ upload preset (Unsigned)
};

function entryMap() {
  var m = {}, re = /entry\.(\d+)=([^&#]*)/g, x;
  while ((x = re.exec(CONFIG.PREFILLED))) m[decodeURIComponent(x[2])] = x[1];
  return m;
}
function uploadAudio() {
  var fd = new FormData();
  fd.append('file', audio.blob, 'voice'); fd.append('upload_preset', CONFIG.UPLOAD_PRESET); fd.append('folder', 'a1-benchmark');
  return fetch('https://api.cloudinary.com/v1_1/' + CONFIG.CLOUD_NAME + '/video/upload', {method: 'POST', body: fd})
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.secure_url) throw new Error('audio upload'); return j.secure_url; });
}
function postForm(fields) {
  var map = entryMap(), body = new URLSearchParams();
  Object.keys(fields).forEach(function (k) {
    if (!map[k]) throw new Error('field "' + k + '" not found in PREFILLED link');
    body.append('entry.' + map[k], fields[k]);
  });
  var url = CONFIG.FORM_URL.replace(/\/viewform.*$/, '') + '/formResponse';
  return fetch(url, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body});
}
function submitAll() {
  return uploadAudio().then(function (link) {
    var L = ['A', 'B', 'C', 'D'], f = {name: info.name, cls: info.cls, writing: writing, voice: link};
    Object.keys(ans).forEach(function (k) { f[k] = L[ans[k]]; });
    return postForm(f);
  });
}
var MODE = 'student';
var app = document.getElementById('app');

/* ================= STUDENT VIEW ================= */
{
  var PASSAGE = '<h4>Subject: My New Apartment!</h4>Hi Mona,<br>How are you? I am writing to tell you about my new apartment. It is small, but very nice and modern. There is one bedroom, a living room, a small kitchen, and a bathroom. My favorite room is the living room because it has a big window and a comfortable sofa. The apartment is near a big supermarket and a bus station, so it is very easy to go to work. Come and visit me next Friday!<br><br>Best,<br>Sara';
  var G = 'Grammar & Vocabulary', R = 'Reading';
  var Q = [
    ['q1', G, '................. is your bag? — "It is on the table."', ['Who', 'Where', 'When', 'What']],
    ['q2', G, 'Excuse me, how ................. does this jacket cost?', ['many', 'often', 'much', 'old']],
    ['q3', G, 'My parents ................. in Giza; they live in Maadi.', ["doesn't live", "aren't live", "don't live", 'not live']],
    ['q4', G, 'Look! It ................. outside. Take your umbrella.', ['rains', 'is raining', 'rained', 'rain']],
    ['q5', G, 'Yesterday, we ................. a great movie at the cinema.', ['watch', 'watches', 'watched', 'watching']],
    ['q6', G, 'I usually drink coffee ................. the morning.', ['on', 'at', 'in', 'to']],
    ['q7', G, 'There ................. two apples and a banana on the plate.', ['is', 'are', 'has', 'be']],
    ['q8', G, 'Can you pass me ................. salt, please?', ['a', 'an', 'the', 'some']],
    ['q9', G, 'She is very .................; she always helps everyone.', ['friendly', 'hungry', 'expensive', 'boring']],
    ['q10', G, '"What time is it?" — "It is 7:30." It is .................', ['half past seven', 'quarter to seven', "seven o'clock", 'quarter past seven']],
    ['r1', R, "Sara's new apartment is very big.", ['True', 'False']],
    ['r2', R, 'How many bedrooms are there in the apartment?', ['One', 'Two', 'Three']],
    ['r3', R, 'Why does Sara like the living room?', ['Because it has a TV.', 'Because it has a big window and a comfortable sofa.', 'Because it is near the kitchen.']],
    ['r4', R, 'Is the apartment far from the supermarket?', ['Yes', 'No']],
    ['r5', R, 'When does Sara invite Mona to visit her?', ['Next Sunday', 'Tomorrow', 'Next Friday']]
  ];
  var TOTAL = Q.length + 2; // + writing + voice
  var step = -1, ans = {}, info = {name: '', cls: ''}, writing = '', audio = null, recording = false, rec, chunks = [], t0, tick, stream;

  function pickMime() {
    var c = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'];
    for (var i = 0; i < c.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i];
    return '';
  }
  function stopRec() { if (rec && rec.state !== 'inactive') rec.stop(); }
  function startRec() {
    if (!navigator.mediaDevices || !window.MediaRecorder) { speakErr(); return; }
    navigator.mediaDevices.getUserMedia({audio: true}).then(function (s) {
      stream = s; chunks = []; var mt = pickMime();
      rec = mt ? new MediaRecorder(s, {mimeType: mt}) : new MediaRecorder(s);
      rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        clearInterval(tick); stream.getTracks().forEach(function (t) { t.stop(); });
        var type = String(rec.mimeType || mt || 'audio/webm').split(';')[0];
        var blob = new Blob(chunks, {type: type});
        audio = {blob: blob, url: URL.createObjectURL(blob), mime: type};
        recording = false; drawSpeak();
      };
      rec.start(); recording = true; t0 = Date.now(); drawSpeak();
      tick = setInterval(function () {
        var s2 = Math.floor((Date.now() - t0) / 1000), el = document.getElementById('tm');
        if (el) el.textContent = Math.floor(s2 / 60) + ':' + ('0' + (s2 % 60)).slice(-2);
        if (s2 >= 180) stopRec();
      }, 250);
    }).catch(function () { speakErr(); });
  }
  function speakErr() {
    var e = document.getElementById('serr');
    if (e) e.textContent = 'المايك مقفول. اضغطي على أيقونة القفل 🔒 جنب الرابط واسمحي بالميكروفون، وجرّبي تاني.';
  }
  function drawSpeak() {
    var box = document.getElementById('rc'); if (!box) return;
    var sb = document.getElementById('sb');
    if (recording) {
      box.innerHTML = '<div class="mic rec" id="mic">⏹</div><div class="tm" id="tm">0:00</div><div class="hint">Recording… tap to stop</div>';
      document.getElementById('mic').onclick = stopRec;
    } else if (audio) {
      box.innerHTML = '<div class="hint">✅ Your recording is ready. Listen to it:</div><audio controls src="' + audio.url + '"></audio>' +
        '<button class="ghost" id="again">🔄 Record again</button>';
      document.getElementById('again').onclick = function () { audio = null; drawSpeak(); };
    } else {
      box.innerHTML = '<div class="mic" id="mic">🎙️</div><div class="hint">Tap to start recording (max 3 min)</div>' +
        '<label class="up">📎 Or upload a voice note<input type="file" id="fl" accept="audio/*" hidden></label>';
      document.getElementById('mic').onclick = startRec;
      document.getElementById('fl').onchange = function () {
        var f = this.files[0]; if (!f) return;
        if (f.size > 12 * 1024 * 1024) { document.getElementById('serr').textContent = 'الملف كبير، لازم يكون أقل من 12MB.'; return; }
        audio = {blob: f, url: URL.createObjectURL(f), mime: f.type || 'audio/mpeg'}; drawSpeak();
      };
    }
    if (sb) sb.disabled = !audio || recording;
  }

  function setProg(n) {
    document.getElementById('prog').style.width = (n / (TOTAL + 1) * 100) + '%';
    document.getElementById('count').textContent = n > 0 && n <= TOTAL ? 'Question ' + n + ' / ' + TOTAL : '';
  }

  function render() {
    if (step === -1) {
      setProg(0);
      app.innerHTML = '<div class="card"><span class="chip">Written test • 50 marks</span><h1>A1 Benchmark Pre-Exam</h1>' +
        '<p class="sub rtl">اكتبي بياناتك وابدئي الامتحان. اختاري إجابة واحدة لكل سؤال.</p>' +
        '<label class="f">Full name</label><input id="nm" value="' + info.name + '" autocomplete="off">' +
        '<label class="f">Class</label><input id="cl" value="' + info.cls + '" autocomplete="off">' +
        '<div class="nav"><button class="btn" id="go" disabled>Start exam →</button></div></div>';
      var chk = function () {
        info.name = document.getElementById('nm').value.trim();
        info.cls = document.getElementById('cl').value.trim();
        document.getElementById('go').disabled = !(info.name && info.cls);
      };
      document.getElementById('nm').oninput = chk; document.getElementById('cl').oninput = chk; chk();
      document.getElementById('go').onclick = function () { step = 0; render(); };
      return;
    }
    if (step < Q.length) {
      var q = Q[step], letters = ['A', 'B', 'C', 'D'];
      setProg(step + 1);
      var h = '<div class="card"><span class="chip">' + q[1] + '</span>';
      if (q[1] === R) h += '<div class="passage">' + PASSAGE + '</div>';
      h += '<h2>' + q[2] + '</h2>';
      q[3].forEach(function (o, i) {
        h += '<div class="opt' + (ans[q[0]] === i ? ' sel' : '') + '" data-i="' + i + '"><b>' + letters[i] + '</b><span>' + o + '</span></div>';
      });
      h += '<div class="nav">' + (step > 0 ? '<button class="ghost" id="bk">← Back</button>' : '') +
           '<button class="btn" id="nx"' + (ans[q[0]] === undefined ? ' disabled' : '') + '>Next →</button></div></div>';
      app.innerHTML = h;
      var opts = app.querySelectorAll('.opt');
      opts.forEach(function (el) {
        el.onclick = function () {
          ans[q[0]] = Number(el.getAttribute('data-i'));
          opts.forEach(function (x) { x.classList.remove('sel'); });
          el.classList.add('sel');
          document.getElementById('nx').disabled = false;
        };
      });
      document.getElementById('nx').onclick = function () { step++; render(); };
      if (step > 0) document.getElementById('bk').onclick = function () { step--; render(); };
      window.scrollTo(0, 0);
      return;
    }
    if (step === Q.length) {
      setProg(TOTAL);
      app.innerHTML = '<div class="card"><span class="chip">Guided Writing • 15 marks</span>' +
        '<h2>Write a short message (4–5 sentences) describing your home or apartment.</h2>' +
        '<p class="sub">Use words like: big / small, rooms, living room, kitchen, comfortable</p>' +
        '<textarea id="wr" placeholder="Hi! My apartment is...">' + writing + '</textarea>' +
        '<div class="err" id="er"></div>' +
        '<div class="nav"><button class="ghost" id="bk">← Back</button><button class="btn" id="sb" disabled>Next →</button></div></div>';
      var w = document.getElementById('wr'), sb = document.getElementById('sb');
      var cw = function () { writing = w.value; sb.disabled = w.value.trim().length < 15; };
      w.oninput = cw; cw();
      document.getElementById('bk').onclick = function () { step--; render(); };
      sb.onclick = function () { step++; render(); };
      return;
    }
    if (step === Q.length + 1) {
      setProg(TOTAL);
      app.innerHTML = '<div class="card"><span class="chip">Speaking • Voice note</span>' +
        '<h2>Record yourself answering these questions</h2>' +
        '<ol class="say"><li>Tell me your phone number.</li><li>What did you do yesterday and today?</li>' +
        '<li>What are you wearing today?</li><li>What food do you like? What food do you dislike? Why?</li>' +
        '<li>How do you come to class?</li></ol>' +
        '<div class="recbox" id="rc"></div><div class="err" id="serr"></div>' +
        '<div class="nav"><button class="ghost" id="bk">← Back</button><button class="btn" id="sb" disabled>Submit exam ✓</button></div></div>';
      drawSpeak();
      document.getElementById('bk').onclick = function () { stopRec(); step--; render(); };
      document.getElementById('sb').onclick = function () {
        var sb = this; sb.disabled = true; sb.textContent = 'Uploading…';
        submitAll().then(function () { step = 99; render(); })
          .catch(function (e) {
            document.getElementById('serr').textContent = 'حصلت مشكلة في الإرسال، جرّبي تاني. (' + e.message + ')';
            sb.disabled = false; sb.textContent = 'Submit exam ✓';
          });
      };
      return;
    }
    setProg(TOTAL + 1);
    document.getElementById('count').textContent = '';
    app.innerHTML = '<div class="card center"><div class="tick">✓</div><h1>All done!</h1>' +
      '<p class="sub rtl">تم تسليم الامتحان بنجاح. شكراً يا ' + info.name.replace(/</g, '') + '، بالتوفيق! 🌟</p></div>';
  }
  render();
}
</script>
</body>
</html>
